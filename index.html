<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f4e8c"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><title>Gestion du courrier administratif</title>
<style>
:root{--bg:#f3f5fa;--c:#fff;--t:#1b2433;--m:#64708a;--p:#1f4e8c;--b:#dde3ee;--ok:#1a8a5a;--w:#c27a00;--e:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1521;--c:#182033;--t:#e8ecf5;--m:#9aa6bf;--p:#6ea2f0;--b:#2a3550;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1521;--c:#182033;--t:#e8ecf5;--m:#9aa6bf;--p:#6ea2f0;--b:#2a3550;color-scheme:dark}
html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
header{background:var(--p);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:17px;flex:1}header small{opacity:.85}
@media(max-width:600px){header b{font-size:15px;flex:1 1 60%}header small{order:5;flex-basis:100%}header button.b{padding:6px 9px;font-size:13px}}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b);padding:6px 10px}
nav button{white-space:nowrap;border:0;background:none;color:var(--m);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--p);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px}.kpi b{font-size:26px;display:block}.kpi span{color:var(--m);font-size:13px}
h2{margin:0 0 10px;font-size:18px}h3{margin:0 0 8px;font-size:15px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b);vertical-align:top}th{color:var(--m);font-weight:600;white-space:nowrap}
tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}
button.b{background:var(--p);color:#fff;border:0;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer;margin:8px 6px 0 0}button.g{background:var(--bg);color:var(--t);border:1px solid var(--b)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--b)}
.late{color:var(--e);border-color:var(--e)}.done{color:var(--ok);border-color:var(--ok)}.prog{color:var(--w);border-color:var(--w)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar i{display:block;height:14px;background:var(--p);border-radius:4px;min-width:3px}.bar span:first-child{width:130px;color:var(--m)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px;z-index:5}
.modal>div{background:var(--c);border-radius:12px;padding:16px;max-width:820px;width:100%}
.login{max-width:380px;margin:8vh auto;padding:14px}
.hero{background:linear-gradient(135deg,var(--p),#0e2a4f);color:#fff;min-height:100vh;display:flex;flex-direction:column}
.hero .in{max-width:1100px;margin:0 auto;padding:0 18px;width:100%}
.hnav{display:flex;align-items:center;justify-content:space-between;padding:16px 0}.hnav b{font-size:16px;letter-spacing:.5px}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:24px 0 40px}
.hg h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:8px 0 12px}
.kick{text-transform:uppercase;letter-spacing:2px;font-size:12px;opacity:.8}
.slo{font-size:clamp(17px,2.4vw,22px);font-style:italic;margin:0 0 10px}
.hg p{opacity:.88;max-width:520px}
.cta{background:#fff;color:#0e2a4f;border:0;padding:13px 22px;border-radius:10px;font:600 16px system-ui;cursor:pointer;margin-top:14px}
.sl{position:relative;height:230px;border-radius:14px;overflow:hidden;margin:0 0 26px;background:#0e2a4f;box-shadow:0 6px 24px #0005}
.sli{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 56px 30px;opacity:0;transition:opacity .6s;background-size:cover;background-position:center;pointer-events:none}
.sli.on{opacity:1;pointer-events:auto}.sli:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000b,#0004 60%,transparent)}
.sli>*{position:relative}.sli h3{margin:0 0 4px;font-size:clamp(18px,3vw,26px)}.sli p{margin:0;opacity:.93;max-width:720px}
.sln{position:absolute;top:50%;transform:translateY(-50%);background:#0007;color:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer;z-index:2}.sln.p{left:10px}.sln.n{right:10px}
.sld{position:absolute;bottom:8px;left:0;right:0;text-align:center;z-index:2}.sld i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff6;margin:0 3px;cursor:pointer}.sld i.on{background:#fff}
@media(max-width:600px){.sl{height:200px}.sli{padding:16px 46px 26px}}
.hf{background:var(--bg);color:var(--t);padding:26px 0 30px;margin-top:auto}
.hfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.hfg div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px}.hfg b{display:block;margin:4px 0}
@media(max-width:760px){.hg{grid-template-columns:1fr}.hg svg{order:-1;max-height:210px}}
.muted{color:var(--m);font-size:13px}
@page{margin:18mm 15mm;@bottom-center{content:"Page " counter(page);font:10px system-ui}}
@page :first{@bottom-center{content:""}}
#pr{display:none}
@media print{header,nav,button,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0}
body.pr #app{display:none!important}body.pr #pr{display:block}
#pr{font:12px/1.5 Georgia,serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pr .cv{height:235mm;display:flex;flex-direction:column;justify-content:center;text-align:center;page-break-after:always;border:3px double #1f4e8c;padding:20mm 12mm}
#pr .cvt{font:700 18px system-ui;letter-spacing:2px;text-transform:uppercase;color:#1f4e8c}
#pr hr{border:0;border-top:2px solid #1f4e8c;width:60%;margin:18px auto}
#pr .cv h1{font-size:34px;border:0;margin:0}#pr .cv h2{font:400 17px system-ui;margin:10px 0}
#pr .cvf{margin-top:50mm;font-size:12px}
#pr h1{font:700 22px system-ui;color:#1f4e8c;border-bottom:2px solid #1f4e8c;padding-bottom:6px}
#pr .pg{page-break-before:always}
#pr .toc{list-style:none;padding:0;font-size:15px}#pr .toc li{padding:10px 0;border-bottom:1px dotted #999}
#pr table{font-size:11px}#pr th{background:#1f4e8c;color:#fff}}
</style></head><body><div id="app"></div><div id="pr"></div>
<script>
const ROLES=['secretaire','directeur','adjoint','chef_division','chef_section','charge'];
const RL={secretaire:'Secrétaire',directeur:'Directeur',adjoint:'Directeur adjoint',chef_division:'Chef de division',chef_section:'Chef de section',charge:'Chargé d’études',admin:'Administrateur',superviseur:'Superviseur'};
const NAV={secretaire:['dash','arr','dep','box','search','stats'],directeur:['dash','box','dep','search','stats'],adjoint:['dash','box','search','stats'],chef_division:['dash','box','search'],chef_section:['dash','box','search'],charge:['dash','box','search'],admin:['dash','search','stats','users','slides','backup'],superviseur:['dash','sts','struct','ex','slides','search','stats']};
const NL={dash:'Tableau de bord',arr:'Courrier arrivé',dep:'Courrier départ',box:'Ma boîte',search:'Recherche',stats:'Statistiques',struct:'Structure',users:'Agents',backup:'Sauvegarde',ex:'Exercices comptables',act:'Rapport d’activité',sts:'Structures',slides:'Page d’accueil'};
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let D,DB,me=null,view='dash',q={};
async function seed(){const h=await sha('demo');
D={dir:'Direction Générale',divs:[{id:1,nom:'Division Études'},{id:2,nom:'Division Administrative'}],secs:[{id:1,nom:'Section Planification',div:1},{id:2,nom:'Section Statistiques',div:1},{id:3,nom:'Section Personnel',div:2}],
users:[['secretaire','Awa Diallo',0,0],['directeur','Dr Moussa Keita',0,0],['adjoint','Fatou Traoré',0,0],['chef_division','Ibrahim Sow',1,0],['chef_section','Mariam Coulibaly',1,1],['charge','Oumar Ba',1,1],['chef_division','Salif Camara',2,0],['chef_section','Aïcha Konaté',2,3],['charge','Karim Sy',2,3],['admin','Administrateur',0,0]].map((u,i)=>({id:i+1,login:i==9?'admin':u[0]+(i>5&&i<9?i:''),nom:u[1],role:u[0],div:u[2],sec:u[3],h,actif:1})),
arr:[],dep:[],n:0,ex:[{an:new Date().getFullYear(),ouvert:1}]};
D.users[6].login='chefdiv2';D.users[7].login='chefsec2';D.users[8].login='charge2';
const c=add({ref:'N°145/MEF',exp:'Ministère des Finances',objet:'Demande de statistiques budgétaires 2026',dateRecep:today(),lim:'2026-10-20',prio:'Urgent'},1);
c.hist.push({from:1,to:2,date:new Date().toISOString(),instr:'Pour avis et instructions',rec:new Date().toISOString(),st:'Reçu'});c.holder=2;c.statut='En cours';
add({ref:'N°12/ONG',exp:'ONG Développement',objet:'Invitation à l’atelier régional',dateRecep:today(),lim:'2026-12-15',prio:'Normal'},1);D.id=1;DB={sup:[],sts:[D],cur:1};save()}
function add(o,uid){const y=o.ex||curEx()||new Date().getFullYear();D.n++;const c={id:D.n,num:'ARR-'+y+'-'+String(D.arr.filter(k=>k.ex==y).length+1).padStart(4,'0'),ex:y,...o,holder:uid,statut:'Enregistré',files:o.files||[],hist:[],cr:''};D.arr.push(c);return c}
function save(){try{localStorage.setItem('courrierDB',JSON.stringify(DB))}catch(e){}}
const U=id=>D.users.find(u=>u.id==id);const un=id=>U(id)?.nom||'—';
const late=c=>c.statut!='Traité'&&c.lim&&c.lim<today();
const days=c=>Math.ceil((new Date(c.lim)-new Date(today()))/864e5);
function vis(){if(['secretaire','directeur','adjoint','admin','superviseur'].includes(me.role))return D.arr;return D.arr.filter(c=>c.holder==me.id||c.hist.some(h=>h.from==me.id||h.to==me.id))}
function lvl(c){if(c.statut=='Traité')return'Archivé';const u=U(c.holder);return u?RL[u.role]:'—'}
function stag(c){return late(c)?'<span class="tag late">En retard</span>':c.statut=='Traité'?'<span class="tag done">Traité</span>':c.statut=='En cours'?'<span class="tag prog">En cours</span>':'<span class="tag">Enregistré</span>'}
function norm(d){d.ex=d.ex||[];d.arr.forEach(c=>c.ex=c.ex||+c.dateRecep.slice(0,4));[...new Set([new Date().getFullYear(),...d.arr.map(c=>c.ex)])].forEach(y=>{if(!d.ex.some(x=>x.an==y))d.ex.push({an:y,ouvert:1})});const sp=d.users.filter(u=>u.role=='superviseur');if(sp.length){sp.forEach(u=>DB.sup.some(x=>x.login==u.login)||DB.sup.push(u));d.users=d.users.filter(u=>u.role!='superviseur')}}
async function init(){try{DB=JSON.parse(localStorage.getItem('courrierDB'))}catch(e){}
if(!DB){let o=null;try{o=JSON.parse(localStorage.getItem('courrierD'))}catch(e){}if(o){o.id=1;DB={sup:[],sts:[o],cur:1}}else await seed()}
DB.sup=DB.sup||[];DB.slides=DB.slides||DEFSL();DB.sts.forEach((s,i)=>{s.id=s.id||i+1;norm(s)});
if(!DB.sup.length)DB.sup.push({id:9001,login:'superviseur',nom:'Superviseur',role:'superviseur',div:0,sec:0,h:DB.sts[0].users[0]?.h||await sha('demo'),actif:1,ok:0});
D=DB.sts.find(s=>s.id==DB.cur)||DB.sts[0];DB.cur=D.id;save();render()}
const appName=()=>DB.sts.length>1?'Gestion du courrier administratif':D.dir;
function loginTaken(l,id){return DB.sup.some(u=>u.login==l&&u.id!=id)||DB.sts.some(s=>s.users.some(u=>u.login==l&&!(s===D&&u.id==id)))}
function swSt(id){DB.cur=+id;D=DB.sts.find(s=>s.id==id);view='dash';save();render()}
const stSel=()=>`<select onchange="swSt(this.value)" style="width:auto;max-width:62vw;padding:5px;font-weight:700">${DB.sts.map(s=>`<option value="${s.id}" ${s===D?'selected':''}>${esc(s.dir)}</option>`).join('')}</select>`;
const stsView=()=>`<div class="card"><h2>Nouvelle structure</h2><p class="muted">Chaque structure dispose de son propre espace : divisions, sections, agents, courriers et exercices. Les données ne sont pas visibles d’une structure à l’autre. Indiquez le compte administrateur qui l’animera.</p><div class="f"><div><label>Nom de la structure</label><input id="n_s"></div><div><label>Nom de l’administrateur</label><input id="n_an"></div><div><label>Identifiant administrateur</label><input id="n_al" autocapitalize="none"></div><div><label>Mot de passe initial</label><input id="n_ap" type="password"></div></div><button class="b" onclick="addSt()">Créer la structure</button></div><div class="card tw"><h2>Structures (${DB.sts.length})</h2><table><tr><th>Structure</th><th>Agents</th><th>Courriers</th><th>Exercice ouvert</th><th></th></tr>${DB.sts.map(s=>`<tr><td><b>${esc(s.dir)}</b>${s===D?' <span class="tag done">Active</span>':''}</td><td>${s.users.length}</td><td>${s.arr.length}</td><td>${s.ex.filter(x=>x.ouvert).map(x=>x.an).join(', ')||'—'}</td><td style="white-space:nowrap"><button class="b g" style="margin:0 4px 0 0" onclick="swSt(${s.id})">Ouvrir</button><button class="b g" style="margin:0 4px 0 0" onclick="editSt(${s.id})">Modifier</button><button class="b g" style="margin:0;color:var(--e)" onclick="delSt(${s.id})">Supprimer</button></td></tr>`).join('')}</table></div>`;
async function addSt(){const n=$('n_s').value.trim(),an=$('n_an').value.trim(),l=$('n_al').value.trim(),p=$('n_ap').value;if(!n||!an||!l||p.length<4||loginTaken(l))return alert('Champs invalides ou identifiant déjà utilisé (mot de passe ≥ 4).');if(DB.sts.some(s=>s.dir.toLowerCase()==n.toLowerCase()))return alert('Une structure porte déjà ce nom.');const id=Math.max(...DB.sts.map(s=>s.id))+1;DB.sts.push({id,dir:n,divs:[],secs:[],users:[{id:Date.now(),login:l,nom:an,role:'admin',div:0,sec:0,h:await sha(p),actif:1,ok:0}],arr:[],dep:[],n:0,ex:[{an:new Date().getFullYear(),ouvert:1}]});swSt(id);alert('Structure créée. Vous travaillez maintenant dans son espace.')}
function render(){const a=$('app');if(!me)NANN=null;if(!me&&land){a.innerHTML=hero();slStart();return}if(!me){a.innerHTML=`<div class="login card"><h2>Gestion du courrier administratif</h2><label>Identifiant</label><input id="lg" autocapitalize="none"><label>Mot de passe</label><input id="pw" type="password"><button class="b" onclick="login()">Se connecter</button><button class="b g" onclick="land=1;render()">← Accueil</button><p id="er" class="late"></p></div>`;return}
const mine=D.arr.filter(c=>c.holder==me.id&&c.statut!='Traité').length;
a.innerHTML=`<header><b>📬 ${me.role=='superviseur'?stSel():esc(D.dir)}</b><small>${esc(me.nom)} · ${RL[me.role]}</small>${ROLES.includes(me.role)?`<button id="bell" class="b g" style="margin:0" onclick="notifPanel()">🔔 ${unreadL().length}</button>`:''}<button class="b g" style="margin:0" onclick="themeModal()">🎨 Apparence</button><button class="b g" style="margin:0" onclick="pwModal(0)">🔑 Mot de passe</button><button class="b g" style="margin:0" onclick="me=null;land=1;applyTheme();render()">Quitter</button></header><nav>${NAV[me.role].concat('act').map(v=>`<button class="${v==view?'on':''}" onclick="nav('${v}')">${NL[v]}</button>`).join('')}</nav><main>${V[view]()}</main><div id="md"></div>`;announce()}
async function login(){const l=$('lg').value.trim(),hh=await sha($('pw').value);let f=null;for(const u of DB.sup)if(u.login==l&&u.actif&&u.h==hh)f={u,st:null};if(!f)for(const s of DB.sts){const u=s.users.find(x=>x.login==l&&x.actif&&x.h==hh);if(u){f={u,st:s};break}}
if(f){if(f.st){DB.cur=f.st.id;D=f.st}me=f.u;applyTheme(me);view='dash';render();if(!me.ok)pwModal(1)}else $('er').textContent='Identifiants invalides.'}
function nav(v){view=v;render()}
function tbl(list,cols){return`<div class="tw"><table><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${list.map(c=>`<tr class="r" onclick="open_(${c.id})">${cols.map(k=>`<td>${k[1](c)}</td>`).join('')}</tr>`).join('')||'<tr><td>Aucun courrier.</td></tr>'}</table></div>`}
const COLS=[['N°',c=>'<b>'+c.num+'</b>'],['Expéditeur',c=>esc(c.exp)],['Objet',c=>esc(c.objet)],['Reçu',c=>fd(c.dateRecep)],['Limite',c=>fd(c.lim)],['Détenteur',c=>esc(un(c.holder))],['Niveau',lvl],['Statut',stag]];
const V={
dash(){const l=vis(),t=l.filter(c=>c.statut=='Traité').length,r=l.filter(late);const lv={};l.forEach(c=>lvl(c)&&(lv[lvl(c)]=(lv[lvl(c)]||0)+1));const mx=Math.max(1,...Object.values(lv));
return`<div class="grid"><div class="kpi"><b>${l.length}</b><span>Courriers</span></div><div class="kpi"><b>${l.length-t}</b><span>En traitement</span></div><div class="kpi"><b>${t}</b><span>Traités / archivés</span></div><div class="kpi"><b style="color:var(--e)">${r.length}</b><span>En retard</span></div></div>
<div class="card"><h3>Répartition par niveau de traitement</h3>${Object.entries(lv).map(([k,v])=>`<div class="bar"><span>${k}</span><i style="width:${v/mx*60}%"></i><b>${v}</b></div>`).join('')||'<span class="muted">Aucune donnée.</span>'}</div>
<div class="card"><h3>⚠️ Alertes de retard</h3>${tbl(r,COLS.slice(0,3).concat([['Retard',c=>-days(c)+' j'],['Détenteur',c=>esc(un(c.holder))]]))}</div>`},
box(){const l=D.arr.filter(c=>c.holder==me.id&&c.statut!='Traité');return`<div class="card"><h2>Courriers en ma possession</h2>${tbl(l,COLS)}</div>`},
arr(){return`<div class="card"><h2>Enregistrer un courrier arrivé <span class="tag">Exercice ${curEx()||'— aucun ouvert'}</span></h2><div class="f"><div><label>Référence</label><input id="f_ref"></div><div><label>Expéditeur</label><input id="f_exp"></div><div><label>Date de réception</label><input id="f_dr" type="date" value="${today()}"></div><div><label>Délai limite</label><input id="f_lim" type="date"></div><div><label>Priorité</label><select id="f_pr"><option>Normal</option><option>Urgent</option><option>Très urgent</option></select></div><div><label>Pièces jointes (PDF, Word, Excel)</label><input id="f_fi" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx"></div></div><label>Objet</label><textarea id="f_ob" rows="2"></textarea><button class="b" onclick="saveArr()">Enregistrer</button></div><div class="card"><h2>Registre d’arrivée</h2>${tbl([...D.arr].reverse(),COLS)}</div>`},
dep(){return`<div class="card"><h2>Courrier départ</h2><div class="f"><div><label>Destinataire</label><input id="d_dest"></div><div><label>Référence</label><input id="d_ref"></div><div><label>Date</label><input id="d_date" type="date" value="${today()}"></div></div><label>Objet</label><textarea id="d_ob" rows="2"></textarea><button class="b" onclick="saveDep()">Enregistrer le départ</button></div><div class="card"><h2>Registre de départ</h2><div class="tw"><table><tr><th>N°</th><th>Date</th><th>Destinataire</th><th>Objet</th><th>Par</th></tr>${[...D.dep].reverse().map(d=>`<tr><td><b>${d.num}</b></td><td>${fd(d.date)}</td><td>${esc(d.dest)}</td><td>${esc(d.objet)}</td><td>${esc(un(d.by))}</td></tr>`).join('')||'<tr><td>Aucun.</td></tr>'}</table></div></div>`},

const b64=a=>{const u=new Uint8Array(a);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
V.backup=()=>`<div class="card"><h2>🔒 Sauvegarde chiffrée</h2><p class="muted">Toutes les données (courriers, historiques, pièces jointes, agents, structure) sont chiffrées en AES-256-GCM avec votre phrase secrète avant d’être téléchargées. Sans cette phrase, le fichier est illisible : conservez-la en lieu sûr.</p><p>Dernière sauvegarde : <b>${D.lastBackup?new Date(D.lastBackup).toLocaleString('fr-FR'):'jamais'}</b></p><div class="f"><div><label>Phrase secrète (8 caractères min.)</label><input id="b_p" type="password"></div><div><label>Confirmer</label><input id="b_p2" type="password"></div></div><button class="b" onclick="doBackup()">⬇ Créer la sauvegarde chiffrée</button></div><div class="card"><h2>Restaurer une sauvegarde</h2><p class="muted">La restauration fusionne la sauvegarde avec les données actuelles : seuls les éléments manquants sont ajoutés, les doublons sont ignorés et rien n’est supprimé.</p><div class="f"><div><label>Fichier (.ccrypt)</label><input id="r_f" type="file" accept=".ccrypt,.json"></div><div><label>Phrase secrète</label><input id="r_p" type="password"></div></div><button class="b g" onclick="doRestore()">Fusionner la sauvegarde</button></div>`;
async function doBackup(){const p=$('b_p').value;if(p.length<8||p!=$('b_p2').value)return alert('Phrase secrète de 8 caractères minimum, identique dans les deux champs.');
D.lastBackup=new Date().toISOString();save();const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await kdf(p,salt),new TextEncoder().encode(JSON.stringify(D)));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'courrier',v:1,salt:b64(salt),iv:b64(iv),data:b64(ct)})],{type:'application/json'}));a.download='sauvegarde-courrier-'+today()+'.ccrypt';a.click();render()}
async function doRestore(){const f=$('r_f').files[0],p=$('r_p').value;if(!f||!p)return alert('Choisissez un fichier et saisissez la phrase secrète.');
let d;try{const o=JSON.parse(await f.text());const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},await kdf(p,ub64(o.salt)),ub64(o.data));d=JSON.parse(new TextDecoder().decode(pt));if(!d.users||!d.arr)throw 0}catch(e){return alert('Phrase secrète incorrecte ou fichier invalide.')}
ask('Fusionner cette sauvegarde avec les données actuelles ? Rien n’est supprimé ni écrasé ; les doublons sont ignorés.',()=>{const s=mergeData(d);save();render();alert('Fusion terminée : '+s.c+' courrier(s) ajouté(s), '+s.m+' mis à jour, '+s.dp+' départ(s), '+s.u+' agent(s), '+s.dv+' division(s)/section(s), '+s.x+' exercice(s). Les doublons ont été ignorés.')})}
function nid(a,id){return a.some(x=>x.id==id)?Math.max(0,...a.map(x=>+x.id||0))+1:id}
function mergeData(d){const s={u:0,c:0,m:0,x:0,dv:0,dp:0},dm={},sm={},um={},lc=v=>String(v||'').trim().toLowerCase(),kc=c=>[c.ref,c.exp,c.objet,c.dateRecep].map(lc).join('|'),kd=c=>[c.dest,c.ref,c.objet,c.date].map(lc).join('|');
(d.divs||[]).forEach(b=>{let l=D.divs.find(x=>lc(x.nom)==lc(b.nom));if(!l){l={id:nid(D.divs,b.id),nom:b.nom};D.divs.push(l);s.dv++}dm[b.id]=l.id});
(d.secs||[]).forEach(b=>{const dv=dm[b.div]??b.div;let l=D.secs.find(x=>lc(x.nom)==lc(b.nom)&&x.div==dv);if(!l){l={id:nid(D.secs,b.id),nom:b.nom,div:dv};D.secs.push(l);s.dv++}sm[b.id]=l.id});
(d.users||[]).filter(b=>b.role!='superviseur'&&(D.users.some(x=>x.login==b.login)||!loginTaken(b.login))).forEach(b=>{let l=D.users.find(x=>x.login==b.login);if(!l){l={...b,id:nid(D.users,b.id),div:b.div?dm[b.div]??0:0,sec:b.sec?sm[b.sec]??0:0};D.users.push(l);s.u++}um[b.id]=l.id});
(d.ex||[]).forEach(b=>{if(!D.ex.some(x=>x.an==b.an)){D.ex.push({...b});s.x++}});
(d.arr||[]).forEach(b=>{const l=D.arr.find(x=>kc(x)==kc(b)),hist=(b.hist||[]).map(h=>({...h,from:um[h.from]??h.from,to:um[h.to]??h.to}));
if(l){if(hist.length>l.hist.length){l.hist=hist;l.holder=um[b.holder]??b.holder;l.statut=b.statut;l.cr=b.cr;s.m++}return}
const y=b.ex||+String(b.dateRecep).slice(0,4);if(!D.ex.some(x=>x.an==y)){D.ex.push({an:y,ouvert:0});s.x++}
let num=b.num,n=D.arr.filter(x=>x.ex==y).length;while(D.arr.some(x=>x.num==num)){n++;num='ARR-'+y+'-'+String(n).padStart(4,'0')}
D.n++;D.arr.push({...b,id:D.n,num,ex:y,holder:um[b.holder]??b.holder,hist});s.c++});
(d.dep||[]).forEach(b=>{if(D.dep.some(x=>kd(x)==kd(b)))return;let num=b.num,n=D.dep.length;while(D.dep.some(x=>x.num==num)){n++;num='DEP-'+String(b.date||today()).slice(0,4)+'-'+String(n).padStart(4,'0')}D.dep.push({...b,num,by:um[b.by]??b.by});s.dp++});return s}

if(h.from==u.id&&h.to!=u.id&&inP(h.date))tr++;if(h.st=='Traité'&&h.from==u.id&&inP(h.date))ok++}));
const hold=D.arr.filter(c=>c.holder==u.id&&c.statut!='Traité'),lt=hold.filter(late).length,moy=dl.length?(dl.reduce((a,b)=>a+b,0)/dl.length).toFixed(1):'—';

function slSet(i){const e=$('sl');if(!e)return;const n=e.querySelectorAll('.sli').length;SLI=(i+n)%n;e.querySelectorAll('.sli').forEach((x,k)=>x.classList.toggle('on',k==SLI));e.querySelectorAll('.sld i').forEach((x,k)=>x.classList.toggle('on',k==SLI))}
function slGo(d){slSet(SLI+d);slStart()}
function slStart(){clearInterval(SLT);if($('sl')&&SLIDES().length>1)SLT=setInterval(()=>{if(!$('sl'))return clearInterval(SLT);slSet(SLI+1)},5500)}
function img(f){return new Promise(r=>{if(!f)return r('');const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1100/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};im.onerror=()=>r('');im.src=rd.result};rd.onerror=()=>r('');rd.readAsDataURL(f)})}
async function slPersist(list){DB.slides=list;save()}
async function addSlide(){const t=$('sl_t').value.trim();if(!t)return alert('Le titre est obligatoire.');const im=await img($('sl_i').files[0]);await slPersist([...SLIDES(),{id:Date.now(),titre:t,texte:$('sl_x').value.trim(),image:im}]);render();alert('Diapositive ajoutée.')}
async function slMove(i,d){const l=[...SLIDES()],j=i+d;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];await slPersist(l);render()}
async function delSlide(i){await slPersist(SLIDES().filter((_,k)=>k!=i));render()}
function editSlide(i){const s=SLIDES()[i];window._es=i;$('md').innerHTML=`<div class="modal"><div style="max-width:480px"><h2>Modifier la diapositive</h2><label>Titre</label><input id="e_st" value="${esc(s.titre)}"><label>Texte</label><textarea id="e_sx" rows="3">${esc(s.texte)}</textarea><label>Nouvelle image (laisser vide pour conserver)</label><input id="e_si" type="file" accept="image/*">${s.image?'<label><input id="e_sr" type="checkbox" style="width:auto"> Supprimer l’image actuelle</label>':''}<button class="b" onclick="saveSlide()">Enregistrer</button><button class="b g" onclick="$('md').innerHTML=''">Annuler</button></div></div>`}
async function saveSlide(){const l=[...SLIDES()],s={...l[window._es]};s.titre=$('e_st').value.trim();s.texte=$('e_sx').value.trim();if(!s.titre)return alert('Le titre est obligatoire.');const f=$('e_si').files[0];if(f)s.image=await img(f);else if($('e_sr')&&$('e_sr').checked)s.image='';l[window._es]=s;await slPersist(l);$('md').innerHTML='';render()}
V.slides=()=>`<div class="card"><h2>Diaporama de la page d’accueil</h2><p class="muted">Ces diapositives défilent automatiquement sur la page d’accueil, visible avant la connexion. Image facultative (redimensionnée automatiquement).</p><div class="f"><div><label>Titre</label><input id="sl_t"></div><div><label>Image (JPEG / PNG)</label><input id="sl_i" type="file" accept="image/*"></div></div><label>Texte</label><textarea id="sl_x" rows="2"></textarea><button class="b" onclick="addSlide()">Ajouter la diapositive</button></div><div class="card tw"><table><tr><th>#</th><th>Aperçu</th><th>Titre / texte</th><th></th></tr>${SLIDES().map((s,i)=>`<tr><td>${i+1}</td><td>${s.image?`<img src="${s.image}" alt="" style="width:90px;height:50px;object-fit:cover;border-radius:6px">`:'—'}</td><td><b>${esc(s.titre)}</b><br><span class="muted">${esc(s.texte)}</span></td><td style="white-space:nowrap"><button class="b g" style="margin:0 3px 0 0" onclick="slMove(${i},-1)">↑</button><button class="b g" style="margin:0 3px 0 0" onclick="slMove(${i},1)">↓</button><button class="b g" style="margin:0 3px 0 0" onclick="editSlide(${i})">Modifier</button><button class="b g" style="margin:0;color:var(--e)" onclick="delSlide(${i})">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="4">Aucune diapositive.</td></tr>'}</table></div>`;
let NANN=null;
function notifs(){if(!me||!ROLES.includes(me.role))return[];const out=[];
D.arr.forEach(c=>{if(c.holder==me.id&&c.statut!='Traité'){const h=c.hist.at(-1);
if(h&&!h.rec&&h.to==me.id&&h.from!=me.id)out.push({k:'r'+c.id+'-'+c.hist.length,t:'📨 Nouveau courrier',m:c.num+' — '+c.objet+' (de '+un(h.from)+') : '+h.instr,id:c.id});
if(late(c))out.push({k:'l'+c.id+'-'+today(),t:'⚠️ Courrier en retard',m:c.num+' — '+c.objet+' : '+(-days(c))+' jour(s) de retard',id:c.id});
else if(c.lim&&days(c)>=0&&days(c)<=2)out.push({k:'e'+c.id+'-'+days(c),t:'⏰ Échéance proche',m:c.num+' — '+c.objet+' : échéance dans '+days(c)+' jour(s)',id:c.id})}
else if(c.statut=='Traité'&&c.hist.length&&c.hist.at(-1).from!=me.id&&c.hist.some(h=>h.from==me.id&&h.to!=me.id))out.push({k:'t'+c.id,t:'✅ Courrier traité',m:c.num+' — '+c.objet+' traité par '+un(c.hist.at(-1).from),id:c.id})});return out}
const unreadL=()=>{const r=me?.nr||[];return notifs().filter(n=>!r.includes(n.k))};
function updateBell(){const b=$('bell');if(b)b.textContent='🔔 '+unreadL().length}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.05;o.start();o.stop(c.currentTime+.18)}catch(e){}}
function announce(){if(!me||!ROLES.includes(me.role)){NANN=null;return}updateBell();const u=unreadL();
if(NANN===null){NANN=new Set(notifs().map(n=>n.k));if(u.length)toast('🔔 Vous avez '+u.length+' notification(s) non lue(s).');return}
const nw=u.filter(n=>!NANN.has(n.k));if(!nw.length)return;nw.forEach(n=>NANN.add(n.k));
toast(nw.length>1?'🔔 '+nw.length+' nouvelles notifications.':nw[0].t+' — '+nw[0].m);beep();
try{if('Notification' in window&&Notification.permission=='granted')nw.slice(0,3).forEach(n=>new Notification(n.t,{body:n.m}))}catch(e){}}
function notifPanel(){const l=notifs(),r=me.nr||[];$('md').innerHTML=`<div class="modal"><div style="max-width:560px"><h2>🔔 Notifications</h2>${l.length?l.map(n=>`<div class="card" style="margin:8px 0;cursor:pointer;${r.includes(n.k)?'opacity:.6':'border-color:var(--p)'}" onclick="nOpen(${n.id},'${n.k}')"><b>${n.t}</b>${r.includes(n.k)?'':' <span class="tag prog">nouveau</span>'}<br><span class="muted">${esc(n.m)}</span></div>`).join(''):'<p class="muted">Aucune notification.</p>'}<button class="b" onclick="nAll()">Tout marquer comme lu</button><button class="b g" onclick="$('md').innerHTML='';nav('box')">Ma boîte</button>${'Notification' in window&&Notification.permission=='default'?'<button class="b g" onclick="nPerm()">Activer les alertes du navigateur</button>':''}<button class="b g" onclick="$('md').innerHTML=''">Fermer</button></div></div>`}
function nRead(ks){me.nr=[...new Set([...(me.nr||[]),...ks])].slice(-300);save();updateBell()}
function nOpen(id,k){nRead([k]);open_(id)}
function nAll(){nRead(notifs().map(n=>n.k));notifPanel()}
function nPerm(){try{Notification.requestPermission().then(()=>notifPanel())}catch(e){}}
setInterval(()=>{if(me)announce()},60000);
function doQ(){q={e:$('q_e').value,t:$('q_t').value,s:$('q_s').value,h:$('q_h').value,d1:$('q_d1').value,d2:$('q_d2').value};render()}
function csv(){const r=[['N°','Référence','Expéditeur','Objet','Reçu','Limite','Détenteur','Niveau','Statut']].concat((window._l||[]).map(c=>[c.num,c.ref,c.exp,c.objet,c.dateRecep,c.lim,un(c.holder),lvl(c),late(c)?'En retard':c.statut]));
const s='\ufeff'+r.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='registre.csv';a.click()}
function saveArr(){const o={ref:$('f_ref').value,exp:$('f_exp').value.trim(),objet:$('f_ob').value.trim(),dateRecep:$('f_dr').value,lim:$('f_lim').value,prio:$('f_pr').value};if(!curEx())return alert('Aucun exercice comptable ouvert. Contactez le superviseur.');if(!o.exp||!o.objet)return alert('Expéditeur et objet requis.');
const fs=[...$('f_fi').files].filter(f=>f.size<1.5e6);Promise.all(fs.map(f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r({name:f.name,data:x.result});x.readAsDataURL(f)}))).then(files=>{o.files=files;const c=add(o,me.id);c.hist.push({from:me.id,to:me.id,date:new Date().toISOString(),instr:'Enregistrement au registre d’arrivée',rec:new Date().toISOString(),st:'Enregistré'});save();render()})}
function saveDep(){if(!$('d_dest').value||!$('d_ob').value)return alert('Champs requis.');D.dep.push({num:'DEP-'+new Date().getFullYear()+'-'+String(D.dep.length+1).padStart(4,'0'),dest:$('d_dest').value,ref:$('d_ref').value,objet:$('d_ob').value,date:$('d_date').value,by:me.id});save();render()}
function addDiv(){if($('s_d').value){D.divs.push({id:Date.now(),nom:$('s_d').value});save();render()}}
function addSec(){if($('s_s').value){D.secs.push({id:Date.now(),nom:$('s_s').value,div:+$('s_dv').value});save();render()}}
async function addUser(){const n=$('u_n').value,l=$('u_l').value.trim(),p=$('u_p').value;if(!n||!l||p.length<4||loginTaken(l))return alert('Champs invalides ou identifiant déjà utilisé (mot de passe ≥ 4).');D.users.push({id:Date.now(),login:l,nom:n,role:$('u_r').value,div:+$('u_d').value,sec:+$('u_s').value,h:await sha(p),ok:0,actif:1});save();render()}
function recips(c){const i=ROLES.indexOf(U(c.holder).role),r=ROLES[i+1];if(!r)return[];return D.users.filter(u=>u.actif&&u.role==r&&(r=='chef_section'?u.div==me.div:r=='charge'?u.sec==me.sec:true))}
function open_(id){const c=D.arr.find(x=>x.id==id);const mineC=c.holder==me.id&&c.statut!='Traité'&&exOpen(c.ex);
if(mineC){const h=c.hist.at(-1);if(h&&!h.rec){h.rec=new Date().toISOString();h.st='Reçu';c.statut='En cours';save()}}
const rc=mineC?recips(c):[];
$('md').innerHTML=`<div class="modal"><div><h2>${c.num} ${stag(c)}</h2><p><b>${esc(c.objet)}</b></p><p class="muted">Réf. ${esc(c.ref)} · De : ${esc(c.exp)} · Reçu le ${fd(c.dateRecep)} · Limite ${fd(c.lim)} · ${c.prio||''}</p><p>📍 Détenteur : <b>${esc(un(c.holder))}</b> (${lvl(c)})</p>
${c.files.map(f=>`<a href="${f.data}" download="${esc(f.name)}">📎 ${esc(f.name)}</a>`).join('<br>')}
<h3 style="margin-top:12px">Historique des transmissions</h3><div class="tw"><table><tr><th>De</th><th>À</th><th>Transmis</th><th>Instructions</th><th>Réception</th><th>Statut</th></tr>${c.hist.map(h=>`<tr><td>${esc(un(h.from))}</td><td>${esc(un(h.to))}</td><td>${new Date(h.date).toLocaleString('fr-FR')}</td><td>${esc(h.instr)}</td><td>${h.rec?new Date(h.rec).toLocaleString('fr-FR'):'—'}</td><td>${h.st}</td></tr>`).join('')}</table></div>
${c.cr?`<p><b>Compte rendu :</b> ${esc(c.cr)}</p>`:''}
${mineC&&rc.length?`<h3 style="margin-top:12px">Option 1 — Transmettre</h3><label>Destinataire (${RL[ROLES[ROLES.indexOf(me.role)+1]]})</label><select id="t_to">${rc.map(u=>`<option value="${u.id}">${u.role=='chef_division'?esc(D.divs.find(d=>d.id==u.div)?.nom||'')+' — ':u.role=='chef_section'?esc(D.secs.find(s=>s.id==u.sec)?.nom||'')+' — ':''}${esc(u.nom)}</option>`).join('')}</select><label>Instructions</label><textarea id="t_in" rows="2"></textarea><button class="b" onclick="transmit(${c.id})">Transmettre</button>`:''}
${mineC&&ROLES.includes(me.role)?`<h3 style="margin-top:16px">${rc.length?'Option 2 — Traiter directement':'Traitement'}</h3><p class="muted">${rc.length?'Vous pouvez aussi traiter ce courrier vous-même et le clôturer, sans le transmettre.':'Renseignez le compte rendu pour clôturer le courrier.'}</p><label>Compte rendu</label><textarea id="t_cr" rows="3"></textarea><button class="b" onclick="finish(${c.id})">Clôturer et archiver</button>`:''}
<button class="b g" onclick="$('md').innerHTML='';render()">Fermer</button></div></div>`}
function transmit(id){const c=D.arr.find(x=>x.id==id),to=+$('t_to').value;c.hist.push({from:me.id,to,date:new Date().toISOString(),instr:$('t_in').value||'—',rec:null,st:'Transmis'});c.holder=to;c.statut='En cours';save();$('md').innerHTML='';render()}
function finish(id){const c=D.arr.find(x=>x.id==id);if(!$('t_cr').value.trim())return alert('Compte rendu requis.');c.cr=$('t_cr').value;c.statut='Traité';c.hist.push({from:me.id,to:me.id,date:new Date().toISOString(),instr:'Traitement terminé : '+c.cr,rec:new Date().toISOString(),st:'Traité'});save();$('md').innerHTML='';render()}
window.APP_CONFIG&&APP_CONFIG.supabaseUrl?0:init();
</script>
